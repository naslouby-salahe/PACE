name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-build --no-install-project
      - run: uv run --locked --no-sync --no-build ruff check .
      - run: uv run --locked --no-sync --no-build ruff format --check .
      - run: uv run --locked --no-sync --no-build pyright
      - run: uv run --locked --no-sync --no-build semgrep --config rules/semgrep --no-git-ignore src tests
      - run: uv run --locked --no-sync --no-build lint-imports --config rules/import-linter/contracts.ini
      - run: uv run --locked --no-sync --no-build vulture src --min-confidence 80
      - run: uv run --locked --no-sync --no-build deptry src
      - run: uv run --locked --no-sync --no-build pytest
      - run: uv build
