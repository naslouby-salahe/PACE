[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pace-research"
version = "0.1.0"
description = "Peer-wise calibrated experts for benign-only IoT device onboarding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.6,<2",
  "torch>=2.7.1,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
  "typer>=0.27.2",
  "scipy>=1.18.1",
  "polars>=1.44.2",
  "indexed-bzip2>=1.7.0",
  "matplotlib>=3.9,<4",
]

[project.scripts]
pace = "pace.cli:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
  "deptry>=0.23,<1",
  "hypothesis>=6.115,<7",
  "import-linter>=2.1,<3",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "scikit-learn-stubs>=0.0.3",
  "scipy-stubs>=1.18.1.1",
  "semgrep>=1.100,<2",
  "vulture>=2.14,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=pace --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["pace"]
omit = ["src/pace/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ARG", "PTH"]

[tool.deptry]
known_first_party = ["pace"]
per_rule_ignores = { DEP003 = ["pydantic_core"], DEP002 = ["hypothesis", "import-linter", "pyright", "pytest", "pytest-cov", "ruff", "semgrep", "vulture", "deptry"] }
